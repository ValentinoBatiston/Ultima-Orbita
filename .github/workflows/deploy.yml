# Publica el juego en la rama gh-pages.
#
# La idea: en vez de usar la API de Pages, el build se sube directamente a la
# rama `gh-pages`. En Settings -> Pages la fuente queda en
# "Deploy from a branch" apuntando a `gh-pages`, y eso no necesita ningún
# permiso especial ni configuración extra.
#
# Cada push a main recompila y reemplaza el contenido de gh-pages, así que la
# página online queda siempre al día.
#
# Ver README.md.

name: Publicar en la rama gh-pages

on:
  push:
    branches: [main]
  # Permite relanzar la publicación desde la pestaña Actions sin hacer un push.
  workflow_dispatch:

permissions:
  contents: write

# Si llegan dos pushes juntos, que espere al último.
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # dist/ se convierte en un repositorio propio y se empuja por encima de
      # gh-pages. El --force es necesario: el contenido se reemplaza entero en
      # cada publicación y no se quiere historial de builds viejos.
      - name: Subir el build a gh-pages
        run: |
          cd dist
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Evita que GitHub Pages pase los archivos por Jekyll
          touch .nojekyll
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages